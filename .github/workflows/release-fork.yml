name: Release (Personal Fork)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version to publish (plain x.y.z, for example 1.2.8)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: fork-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  EMDASH_RELEASE_GITHUB_OWNER: 64ix
  EMDASH_RELEASE_GITHUB_REPO: emdash
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate fork release request
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.FORK_MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.FORK_MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          test "$GITHUB_REPOSITORY" = '64ix/emdash' || fail 'This workflow only runs on 64ix/emdash'
          test "$GITHUB_REF" = 'refs/heads/fork-main' || fail 'Dispatch this workflow from fork-main'
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail 'Version must be plain x.y.z'
          test -n "$MACOS_CERTIFICATE_P12" || fail 'Missing FORK_MACOS_CERTIFICATE_P12 secret'
          test -n "$MACOS_CERTIFICATE_PASSWORD" || fail 'Missing FORK_MACOS_CERTIFICATE_PASSWORD secret'

  prepare-release:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.prepare.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: pnpm

      - name: Install release script dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Create or reuse draft release
        id: prepare
        working-directory: apps/emdash-desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          node --experimental-strip-types scripts/release/prepare-release.ts
          --version "$RELEASE_VERSION"

  release-mac:
    needs: prepare-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build
        with:
          node-version: '24.14.0'

      # Mirrors the local setup documented in FORK.md, with one difference forced by
      # the runner being headless: trust is written to the *admin* domain under sudo.
      # `add-trusted-cert` without -d edits the user trust domain, which authd only
      # grants through a GUI authorization prompt — the step would hang, then fail.
      # GitHub-hosted macOS runners give the job passwordless sudo, and the admin
      # domain is consulted by the same trust evaluation, so codesign is satisfied.
      - name: Import fork macOS signing identity
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.FORK_MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.FORK_MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/emdash-fork-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          P12_PATH="$RUNNER_TEMP/emdash-fork-signing.p12"
          CERT_PATH="$RUNNER_TEMP/emdash-fork-signing.crt"

          # Decoded with python3 (setup-build provisions it) rather than base64(1):
          # `gh secret set` keeps the line wrapping of whatever it was fed, and
          # b64decode ignores non-alphabet bytes where BSD base64 would not.
          export P12_PATH CERTIFICATE_P12_BASE64
          python3 -c 'import base64, os, pathlib; pathlib.Path(os.environ["P12_PATH"]).write_bytes(base64.b64decode(os.environ["CERTIFICATE_P12_BASE64"]))'

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Export the public certificate from the keychain instead of unpacking the
          # PKCS#12 again: the p12 was written by LibreSSL with a legacy PBE that an
          # OpenSSL 3 on PATH refuses to read, and Security.framework has no such
          # trouble. No password is involved either.
          security find-certificate -c 'Emdash Fork Signing' -p "$KEYCHAIN_PATH" >"$CERT_PATH"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$CERT_PATH"

          # codesign resolves identities through the user's keychain search list, so
          # append ours rather than replacing the list (as build-fork.sh does locally).
          # shellcheck disable=SC2046
          security list-keychains -d user -s $(security list-keychains -d user | tr -d ' "') "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F 'Emdash Fork Signing'

          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo 'CSC_NAME=Emdash Fork Signing' >> "$GITHUB_ENV"
          echo 'CSC_IDENTITY_AUTO_DISCOVERY=true' >> "$GITHUB_ENV"

      - name: Build workspace
        run: pnpm run build

      # --project-root is not optional here: under pnpm's hoisted linker the native modules are
      # hoisted out of the app, so @electron/rebuild needs the app's package.json for "which
      # modules" and the workspace root's node_modules for "where they are". Without it, it
      # rebuilds nothing, exits 0, and the job ships modules compiled for the runner's system
      # Node. See the note in rebuild-native.ts.
      - name: Rebuild native modules for macOS arm64
        working-directory: apps/emdash-desktop
        run: >
          node --experimental-strip-types scripts/release/rebuild-native.ts
          --arch arm64 --project-root "$GITHUB_WORKSPACE"

      - name: Build and upload signed macOS artifacts
        working-directory: apps/emdash-desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          pnpm exec electron-builder --mac dmg zip --arm64 --publish always
          --config=electron-builder.fork.config.ts
          --config.extraMetadata.version="$RELEASE_VERSION"

      - name: Verify macOS bundle
        working-directory: apps/emdash-desktop
        run: node --experimental-strip-types scripts/release/verify-mac.ts

      - name: Verify packaged native modules load in the packaged Electron
        working-directory: apps/emdash-desktop
        run: node --experimental-strip-types scripts/release/verify-native-abi.ts

      - name: Verify the embedded update feed points at the fork
        working-directory: apps/emdash-desktop
        run: node --experimental-strip-types scripts/release/verify-fork-feed.ts

      # Only the keychain. The admin-domain trust setting is deliberately left behind:
      # `security remove-trusted-cert -d` wants an authorization the runner has no GUI to
      # grant and blocks forever waiting for it — and a hang is not something `|| true`
      # can rescue. It held the v1.2.8 job open at 100% complete until it was cancelled.
      # GitHub-hosted runners are destroyed after the job, so there is nothing left to clean.
      - name: Remove temporary signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/emdash-fork-signing.keychain-db" 2>/dev/null || true

  release-win:
    needs: prepare-release
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build
        with:
          node-version: '24.14.0'
          windows-native: 'true'

      - name: Build workspace
        shell: bash
        run: pnpm run build

      # See the macOS job: without --project-root this silently rebuilds nothing.
      - name: Rebuild native modules for Windows x64
        shell: bash
        working-directory: apps/emdash-desktop
        run: >
          node --experimental-strip-types scripts/release/rebuild-native.ts
          --arch x64 --project-root "$GITHUB_WORKSPACE"

      - name: Build and upload unsigned Windows artifacts
        shell: bash
        working-directory: apps/emdash-desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          pnpm exec electron-builder --win nsis msi --x64 --publish always
          --config=electron-builder.fork.windows.config.ts
          --config.extraMetadata.version="$RELEASE_VERSION"

      - name: Verify Windows artifacts are unsigned
        shell: pwsh
        working-directory: apps/emdash-desktop
        run: |
          $files = Get-ChildItem release/emdash-x64.exe, release/emdash-x64.msi -ErrorAction Stop
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'NotSigned') {
              throw "$($file.Name) had unexpected signature status: $($signature.Status)"
            }
          }

      - name: Verify packaged native modules load in the packaged Electron
        shell: bash
        working-directory: apps/emdash-desktop
        run: node --experimental-strip-types scripts/release/verify-native-abi.ts

      - name: Verify the embedded update feed points at the fork
        shell: bash
        working-directory: apps/emdash-desktop
        run: node --experimental-strip-types scripts/release/verify-fork-feed.ts

  finalize-release:
    needs: [release-mac, release-win]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: pnpm

      - name: Install release script dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify assets and publish GitHub release
        working-directory: apps/emdash-desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRED_ASSETS: >-
            emdash-arm64.dmg,emdash-arm64.dmg.blockmap,emdash-arm64.zip,
            emdash-arm64.zip.blockmap,latest-mac.yml,emdash-x64.exe,
            emdash-x64.exe.blockmap,emdash-x64.msi,latest.yml
        run: >
          node --experimental-strip-types scripts/release/finalize-release.ts
          --version "$RELEASE_VERSION"
          --required-assets "$REQUIRED_ASSETS"
